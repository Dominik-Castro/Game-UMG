<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>El abismo y el, ¿hombre?</title>
    <style>
        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        body {
            background: conic-gradient(
                from var(--angle) at 50% 50%, 
                #000000 0deg, 
                #0a0f24 60deg, 
                #990000 120deg, 
                #000000 180deg, 
                #0a0f24 240deg, 
                #990000 300deg, 
                #000000 360deg
            );
            animation: girarVortice 8s linear infinite;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        @keyframes girarVortice {
            0% { --angle: 0deg; }
            100% { --angle: 360deg; }
        }

        #game-container {
            background-color: rgba(53, 0, 0, 0.93); 
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            width: 500px;
            text-align: center;
            border: 1px solid #ffffff;
            backdrop-filter: blur(6px);
        }
        
        h1 { color: #da0d0d; font-size: 24px; margin-top: 0; }
        #story-text { font-size: 16px; line-height: 1.6; margin-bottom: 25px; min-height: 80px; }
        #luck-result { font-weight: bold; margin-bottom: 15px; color: #fbbf24; min-height: 20px; }
        .options-container { display: flex; flex-direction: column; gap: 10px; }
        button {
            background-color: #000000;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #6e0000; }
        .restart-btn { background-color: #000000; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="game-container">
        <h1 id="title">El abismo y el, ¿hombre?</h1>
        <div id="story-text">Cargando historia... </div>
        <div id="luck-result"></div>
        <div class="options-container" id="options-box"></div>
    </div>

    <script>
        const storyText = document.getElementById('story-text');
        const luckResult = document.getElementById('luck-result');
        const optionsBox = document.getElementById('options-box');

        const storyNodes = {
            inicio: {
                text: "Te encuentras una carta de tu difunta esposa. En su encabezado se lee la palabra 'Abyssus' escrita con una caligrafía temblorosa. ¿Qué decides hacer con ella?",
                options: [
                    { text: "Leerla (El que no arriesga no gana)", nextNode: "leer_carta" },
                    { text: "Quemarla (Llamar a un adulto responsable)", nextNode: "quemar_carta" }
                ]
            },
            leer_carta: {
                text: "La carta dice: 'Sé lo que ocultas en el sótano. El pozo se está abriendo'. Un escalofrío te recorre. Escuchas un crujido sordo bajo tus pies. ¿Qué haces?",
                options: [
                    { text: "Bajar al sótano inmediatamente", nextNode: "bajar_sotano" },
                    { text: "Salir corriendo de la casa hacia el auto", nextNode: "escapar_auto" }
                ]
            },
            quemar_carta: {
                text: "Acercas el papel al fuego. Al encenderse, el humo toma una forma extraña y el piso cede de golpe, dejándote colgando del borde del suelo. Intentas sostenerte...",
                isLuckBased: true,
                successNode: "caída_salvado",
                failNode: "caída_abismo"
            },
            caída_salvado: {
                text: "¡Suerte! Logras impulsarte hacia arriba. La casa está en silencio, pero donde estaba la chimenea ahora hay un túnel oscuro de piedra húmeda.",
                options: [
                    { text: "Entrar al túnel a investigar", nextNode: "final_sabio" },
                    { text: "Huir por la ventana rota", nextNode: "final_sacrificio" }
                ]
            },
            caída_abismo: {
                text: "Tus dedos resbalan. Caes en una oscuridad que parece no tener fin. Escuchas susurros que pronuncian tu nombre mientras desciendes.",
                options: [
                    { text: "Gritar con desesperación", nextNode: "final_atrapado" },
                    { text: "Cerrar los ojos y aceptar el destino", nextNode: "final_ahogado" }
                ]
            },
            bajar_sotano: {
                text: "En el sótano no hay cajas, solo un espejo gigante cubierto por una manta negra. El reflejo del espejo parece moverse por sí solo tras la tela. Decides quitarla de golpe.",
                isLuckBased: true,
                successNode: "espejo_exito",
                failNode: "espejo_fallo"
            },
            espejo_exito: {
                text: "El espejo muestra tu reflejo, pero detrás de ti está ella, sonriendo. Te entrega una llave de plata a través del cristal antes de desvanecerse.",
                options: [
                    { text: "Usar la llave en la trampilla del suelo", nextNode: "final_tesoro" },
                    { text: "Romper el espejo de un golpe", nextNode: "final_valle" }
                ]
            },
            espejo_fallo: {
                text: "Al quitar la manta, el espejo es un portal de vacío puro que empieza a succionarte con una fuerza gravitacional inmensa.",
                options: [
                    { text: "Aferrarte a las tuberías de la pared", nextNode: "final_sacrificio" },
                    { text: "Dejarte llevar hacia el interior", nextNode: "final_rio" }
                ]
            },
            escapar_auto: {
                text: "Subes al auto y aceleras por la carretera neblinosa. De pronto, la radio se enciende sola sintonizando la voz de tu esposa. Distraído, una figura humana se planta frente a los faros.",
                options: [
                    { text: "Dar un volantazo hacia el bosque", nextNode: "final_escape" },
                    { text: "Frenar en seco e investigar", nextNode: "final_atrapado" }
                ]
            },

            final_valle: { text: "🏁 **FINAL 1: La Realidad Rota.** Al romper el cristal el entorno se desvanece. Despiertas en una habitación blanca de hospital. Todo fue un delirio.", isEnd: true },
            final_sabio: { text: "🏁 **FINAL 2: El Historiador del Vacío.** Encontraste los manuscritos ocultos de Abyssus. Ahora comprendes el origen del abismo, pero jamás podrás regresar a la superficie.", isEnd: true },
            final_atrapado: { text: "🏁 **FINAL 3: El Alimento del Abismo.** Aquello que te esperaba en la niebla no era humano. Te convertiste en parte de las sombras.", isEnd: true },
            final_sacrificio: { text: "🏁 **FINAL 4: Sobreviviente Trágico.** Lograste escapar de la propiedad. Perdiste tu cordura y tu casa, pero sigues respirando... por ahora.", isEnd: true },
            final_rio: { text: "🏁 **FINAL 5: El Clon.** Cruzaste el portal. Ahora habitas el mundo del espejo, mientras tu reflejo camina libremente por el mundo real usando tu cuerpo.", isEnd: true },
            final_ahogado: { text: "🏁 **FINAL 6: Paz en el Vacío.** No hubo dolor. Te fusionaste con la nada infinita de Abyssus, olvidando quién eras.", isEnd: true },
            final_escape: { text: "🏁 **FINAL 7: Bucle Infinito.** El auto choca contra un árbol. Despiertas de golpe en tu silla, con una carta en la mano que dice 'Abyssus'...", isEnd: true },
            final_tesoro: { text: "🏁 **FINAL 8: Redención.** La trampilla te llevó a una caja fuerte con los diarios reales de tu esposa. Descubres la verdad, cierras el pozo y por fin encuentras la paz.", isEnd: true }
        };

        function goToNode(nodeKey) {
            const node = storyNodes[nodeKey];
            if (!node) return;

            storyText.innerHTML = node.text;
            optionsBox.innerHTML = '';
            luckResult.innerText = '';

            if (node.isEnd) {
                const restartBtn = document.createElement('button');
                restartBtn.innerText = "🔄 Jugar de nuevo";
                restartBtn.className = "restart-btn";
                restartBtn.onclick = () => goToNode('inicio');
                optionsBox.appendChild(restartBtn);
                return;
            }

            if (node.isLuckBased) {
                const rollBtn = document.createElement('button');
                rollBtn.innerText = "🎲 Dejarlo al destino (Tirar dado)";
                rollBtn.onclick = () => {
                    rollBtn.disabled = true;
                    const suerte = Math.random() >= 0.5;
                    luckResult.innerText = "El abismo decide...";
                    
                    setTimeout(() => {
                        if (suerte) {
                            luckResult.style.color = "#2ecc71";
                            luckResult.innerText = "🍀 El abismo te permite avanzar.";
                            setTimeout(() => goToNode(node.successNode), 1200);
                        } else {
                            luckResult.style.color = "#ef4444";
                            luckResult.innerText = "❌ La oscuridad te reclama.";
                            setTimeout(() => goToNode(node.failNode), 1200);
                        }
                    }, 1000);
                };
                optionsBox.appendChild(rollBtn);
                return;
            }

            node.options.forEach(option => {
                const btn = document.createElement('button');
                btn.innerText = option.text;
                btn.onclick = () => goToNode(option.nextNode);
                optionsBox.appendChild(btn);
            });
        }

        goToNode('inicio');
    </script>
</body>
</html>
